[mod-setting-name]
show_speed_control_gui=Show Speed Control GUI
speed_increment_decrease1=Speed Decrement (Largest)
speed_increment_decrease=Speed Decrement (Medium)
speed_increment_decrease2=Speed Decrement (Smallest)
speed_increment_increase2=Speed Increment (Smallest)
speed_increment_increase=Speed Increment (Medium)
speed_increment_increase1=Speed Increment (Largest)

[mod-setting-description]
show_speed_control_gui=If enabled, shows the speed control buttons in the top toolbar. Hotkeys will work regardless of this setting.
speed_increment_decrease1=Sets the amount to decrease the game speed when using the largest decrement button or hotkey.
speed_increment_decrease=Sets the amount to decrease the game speed when using the medium decrement button or hotkey.
speed_increment_decrease2=Sets the amount to decrease the game speed when using the smallest decrement button or hotkey.
speed_increment_increase2=Sets the amount to increase the game speed when using the smallest increment button or hotkey.
speed_increment_increase=Sets the amount to increase the game speed when using the medium increment button or hotkey.
speed_increment_increase1=Sets the amount to increase the game speed when using the largest increment button or hotkey.

[controls]
decrease1=Decrease Speed (Largest)
decrease=Decrease Speed (Medium)
decrease2=Decrease Speed (Smallest)
increase2=Increase Speed (Smallest)
increase=Increase Speed (Medium)
increase1=Increase Speed (Largest)